[project]
name = "gemini-shopping-assistant"
version = "2.0.0"
description = "AI shopping assistant backend: FastAPI + Google Gemini (google-genai)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54",
    "gunicorn>=26",
    "uvicorn-worker>=0.4",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "google-genai>=2.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "prometheus-client>=0.26",
    "slowapi>=0.1.10",
    "orjson>=3.12",
    "tenacity>=9.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["E501", "S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
